[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "family-photo-hub-backend"
version = "0.1.0"
description = "Backend API for Family Photo Hub"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn==0.32.*",
    "sqlalchemy==2.0.*",
    "alembic==1.14.*",
    "pydantic==2.8.*",
    "pydantic-settings==2.5.*",
    "httpx==0.27.*",
    "azure-storage-blob==12.23.*",
    "pillow==10.*",
    "opencv-python==4.10.*",
    "openai==1.12.*",
    "python-jose[cryptography]==3.3.*",
    "passlib[argon2]==1.7.*",
    "python-multipart==0.0.*",
    "apscheduler==3.10.*",
]

[project.optional-dependencies]
dev = [
    "pytest==8.*",
    "pytest-asyncio==0.23.*",
    "pytest-cov==5.*",
    "black==24.*",
    "isort==5.*",
    "mypy==1.11.*",
    "ruff==0.6.*",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
